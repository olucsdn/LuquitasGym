<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141418"/>
      <stop offset="50%" stop-color="#09090B"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>

    <!-- Electric Orange Gradient -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8533"/>
      <stop offset="100%" stop-color="#FF5500"/>
    </linearGradient>

    <!-- Chrome Gradient for Barbell Shaft -->
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E4E4E7"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#A1A1AA"/>
    </linearGradient>
  </defs>

  <!-- Background Base (Squircle) -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="4"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#orangeGrad)" stroke-width="2" opacity="0.35"/>

  <!-- Radial Orange Ambient Glow in the Center -->
  <circle cx="256" cy="256" r="140" fill="#FF6B00" opacity="0.16"/>

  <!-- Iconic Angled Heavyweight Dumbbell / Hex Plates -->
  <g transform="translate(256, 256) rotate(-45) translate(-256, -256)">
    <!-- Central Bar / Knurled Grip -->
    <rect x="232" y="80" width="48" height="352" rx="10" fill="url(#chromeGrad)"/>
    
    <!-- Central Grip Texture Lines -->
    <line x1="236" y1="216" x2="276" y2="216" stroke="#121215" stroke-width="3" opacity="0.6"/>
    <line x1="236" y1="232" x2="276" y2="232" stroke="#121215" stroke-width="3" opacity="0.6"/>
    <line x1="236" y1="248" x2="276" y2="248" stroke="#121215" stroke-width="3" opacity="0.6"/>
    <line x1="236" y1="264" x2="276" y2="264" stroke="#121215" stroke-width="3" opacity="0.6"/>
    <line x1="236" y1="280" x2="276" y2="280" stroke="#121215" stroke-width="3" opacity="0.6"/>
    <line x1="236" y1="296" x2="276" y2="296" stroke="#121215" stroke-width="3" opacity="0.6"/>

    <!-- Inner Collars / Presilhas de Ferro -->
    <rect x="216" y="152" width="80" height="18" rx="6" fill="#FFFFFF"/>
    <rect x="216" y="342" width="80" height="18" rx="6" fill="#FFFFFF"/>

    <!-- Top Heavy Plates (Anilhas Superiores) -->
    <!-- Heavy Outer 25kg Plate (Electric Orange) -->
    <rect x="166" y="104" width="180" height="44" rx="14" fill="url(#orangeGrad)"/>
    <rect x="174" y="108" width="164" height="6" rx="3" fill="#FFFFFF" opacity="0.45"/>

    <!-- Secondary 20kg Plate (Graphite / Chrome Border) -->
    <rect x="184" y="68" width="144" height="32" rx="10" fill="#1C1C22" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>

    <!-- Top Plate End Cap (Electric Orange Accent) -->
    <rect x="204" y="40" width="104" height="24" rx="8" fill="url(#orangeGrad)"/>

    <!-- Bottom Heavy Plates (Anilhas Inferiores) -->
    <!-- Heavy Outer 25kg Plate (Electric Orange) -->
    <rect x="166" y="364" width="180" height="44" rx="14" fill="url(#orangeGrad)"/>
    <rect x="174" y="368" width="164" height="6" rx="3" fill="#FFFFFF" opacity="0.45"/>

    <!-- Secondary 20kg Plate (Graphite / Chrome Border) -->
    <rect x="184" y="412" width="144" height="32" rx="10" fill="#1C1C22" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>

    <!-- Bottom Plate End Cap (Electric Orange Accent) -->
    <rect x="204" y="448" width="104" height="24" rx="8" fill="url(#orangeGrad)"/>
  </g>

  <!-- Accent Energy Sparks (Minimalist geometry) -->
  <circle cx="120" cy="120" r="10" fill="#FF8533"/>
  <circle cx="392" cy="392" r="10" fill="#FF8533"/>
</svg>
