<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181C"/>
      <stop offset="100%" stop-color="#0F0F12"/>
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#primary)" stroke-width="8" opacity="0.3"/>

  <!-- Center Glow -->
  <circle cx="256" cy="256" r="160" fill="url(#primary)" opacity="0.1" filter="blur(30px)"/>

  <!-- Stylized Dumbbell / Gym Emblem -->
  <g transform="translate(256,256) rotate(-45) translate(-256,-256)">
    <!-- Barra central -->
    <rect x="226" y="96" width="60" height="320" rx="12" fill="#F4F4F5"/>
    <rect x="236" y="160" width="40" height="192" rx="6" fill="#A1A1AA" opacity="0.5"/>
    
    <!-- Anilhas Esquerdas / Superiores -->
    <rect x="186" y="116" width="140" height="48" rx="16" fill="url(#primary)"/>
    <rect x="166" y="86" width="180" height="36" rx="14" fill="url(#accent)"/>
    <rect x="196" y="56" width="120" height="36" rx="12" fill="url(#primary)"/>

    <!-- Anilhas Direitas / Inferiores -->
    <rect x="186" y="348" width="140" height="48" rx="16" fill="url(#primary)"/>
    <rect x="166" y="390" width="180" height="36" rx="14" fill="url(#accent)"/>
    <rect x="196" y="420" width="120" height="36" rx="12" fill="url(#primary)"/>

    <!-- Presilhas -->
    <rect x="216" y="164" width="80" height="16" rx="6" fill="#F4F4F5"/>
    <rect x="216" y="332" width="80" height="16" rx="6" fill="#F4F4F5"/>
  </g>
</svg>
